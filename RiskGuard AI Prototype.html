.sb{display:flex;justify-content:space-between;padding:14px 26px 4px;font-size:.78rem;font-weight:600;color:var(--ink)}

em{position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--warn);border:2px solid var(--bg2)}
.scr{flex:1;overflow-y:auto;padding:4px 20px 18px;display:flex;flex-direction:column;gap:14px}
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);padding:8px 6px 14px;background:var(--surface)}

.tabbar i{position:relative;display:grid;place-items:center}.tabbar em{top:-2px;right:-4px}
.bal{border-radius:22px;padding:18px;background:linear-gradient(135deg,#0E6F63 0%,#12405F 70%,#1B2D5A 100%);color:#F2F8FB;display:flex;flex-direction:column;gap:6px;box-shadow:0 14px 34px var(--glow)}
.bal span{font-size:.8rem;opacity:.85}.bal b{font-family:var(--display);font-size:2rem;font-variant-numeric:tabular-nums}
.chip{display:inline-block;background:rgba(255,255,255,.16);border-radius:30px;padding:4px 11px;font-size:.76rem;margin:4px 6px 0 0}.chip.w2{background:rgba(242,163,58,.35)}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa button{background:none;border:0;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.72rem;padding:0}
.qa i{width:52px;height:52px;border-radius:16px;border:1px solid var(--line);background:var(--ok-bg);color:var(--accent);display:grid;place-items:center}
.sec{font-size:.98rem;margin-top:2px}
.list{display:flex;flex-direction:column;gap:8px}
.list div{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:11px 13px;font-size:.88rem}
.list i{color:var(--accent);display:grid}

const vols=[.30,.15,.04],corr=[[1,.3,.1],[.3,1,.2],[.1,.2,1]],LIM=[.08,.14,.20];

function calc(s,f){const c=100-s-f,w=[s/100,f/100,c/100];
 const cov=vols.map((a,i)=>vols.map((b,j)=>a*b*corr[i][j]));
 const cw=cov.map(r=>r.reduce((t,x,j)=>t+x*w[j],0));
 const v2=w.reduce((t,x,i)=>t+x*cw[i],0),v=Math.sqrt(v2);
 const rc=w.map((x,i)=>v?x*cw[i]/v2:0);
 return{w:w.map(x=>x*100),rc:rc.map(x=>x*100),v:v*100,var95:1.645*v*Math.sqrt(1/12)*10000}}

function bg(){const svg=$('bg');let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
 let h='<defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3DDBC0" stop-opacity=".28"/><stop offset="1" stop-color="#3DDBC0" stop-opacity="0"/></linearGradient></defs>';

 for(let y=0;y<=900;y+=100)h+=`<line x1="0" y1="${y}" x2="1600" y2="${y}" stroke="var(--grid)"/>`;
 let v=640,pts=[];const n=64,dx=1600/n;
 for(let i=0;i<n;i++){const o=v;v+=(rnd()-.58)*46-3.4;v=Math.max(150,Math.min(800,v));const c=v,hi=Math.max(o,c)+rnd()*22,lo=Math.min(o,c)-rnd()*22,x=i*dx+dx/2,up=c<o;
  const col=up?'#3DDBC0':'#F2A33A';
  h+=`<line x1="${x}" y1="${hi}" x2="${x}" y2="${lo}" stroke="${col}" stroke-opacity=".35"/><rect x="${x-6}" y="${Math.min(o,c)}" width="12" height="${Math.max(3,Math.abs(c-o))}" fill="${col}" fill-opacity=".3"/>`;pts.push([x,c])}
 const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(0)+' '+p[1].toFixed(0)).join(' ');
 h+=`<path d="${d} L1600 900 L0 900Z" fill="url(#ar)"/><path d="${d}" fill="none" stroke="#3DDBC0" stroke-opacity=".5" stroke-width="2.5"/>`;
 svg.innerHTML=h}
